<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>קורקומיין - ראשון בבוקר</title>
<style>
  html, body { margin: 0; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #c { position: absolute; inset: 0; width: 1920px; height: 1080px; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="root" data-width="1920" data-height="1080" data-duration="219.5" data-fps="24">
  <canvas id="c" width="1920" height="1080"></canvas>
  <audio id="song" src="song.mp3" data-start="0" data-duration="219.5" data-volume="1"></audio>
</div>
<script src="lib/gsap.min.js"></script>
<script>window.NO_SPRITES = 1;</script>
<script src="js/fonts.js"></script>
<script src="js/sprites2.js"></script>
<script src="js/env.js"></script>
<script src="js/clip.js"></script>
<script src="js/vector.js"></script>
<script src="js/pro.js"></script>
<script src="js/real.js"></script>
<script>
  // HyperFrames seek protocol: every frame is drawn from the seek time alone.
  window.__hf = window.__hf || {};
  window.__hf.buildReady = window.__hf.buildReady || {};
  const READY = init(ENV_DATA);
  window.__hf.buildReady["korkomain"] = READY;
  // a paused timeline spanning the film, so the runtime has a root clock
  const tl = gsap.timeline({ paused: true });
  tl.to({ v: 0 }, { v: 1, duration: 219.5, ease: "none" }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["root"] = tl;
  const FRAME = t => Math.min(5267, Math.max(0, Math.round(t * 24)));
  window.addEventListener("hf-seek", (e) => {
    const t = e.detail.time;
    e.detail.waitUntil(READY.then(() => render(FRAME(t))));
  });
  READY.then(() => render(0));
</script>
</body>
</html>
